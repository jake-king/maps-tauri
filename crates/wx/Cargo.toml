[package]
name = "wx"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "NOAA weather for the native renderer: MRMS radar (GRIB2) and G-AIRMET hazard areas"

[dependencies]
png = "0.18"
flate2 = "1"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[features]
# fetch from NOAA over HTTPS (wx::fetch)
http = ["dep:ureq"]

[[example]]
name = "live"
required-features = ["http"]

[lints]
workspace = true
