[workspace]
resolver = "2"
members = ["src-tauri", "crates/coords", "crates/vtile", "crates/wx"]

# Documentation is part of the gate (tools/check.sh): every public item is documented, a function
# that returns a Result or can panic says when, names in prose are code-formatted, and rustdoc's
# own lints (broken intra-doc links, bare URLs) fail the `rustdoc` step.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
bare_urls = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
too_long_first_doc_paragraph = "warn"
