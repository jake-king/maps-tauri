[package]
name = "maps-tauri"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "maps_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
coords = { path = "../crates/coords" }
vtile = { path = "../crates/vtile", features = ["http"] }
wx = { path = "../crates/wx", features = ["http"] }
flate2 = "1"

[dev-dependencies]
png = "0.18"

[lints]
workspace = true
