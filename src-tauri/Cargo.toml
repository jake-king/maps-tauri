[package]
name = "maps-tauri"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "maps_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
coords = { path = "../crates/coords" }
vtile = { path = "../crates/vtile", features = ["http"] }
wx = { path = "../crates/wx", features = ["http"] }
flate2 = "1"
base64 = "0.23"

[dev-dependencies]
png = "0.18"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# self-update (src/update.rs): rustls, as everywhere else, and no zip support (only .deb updates)
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
